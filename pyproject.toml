[project]
name = "courtside"
version = "0.1.0"
description = "Local NBA win probabilities and morning recaps"
requires-python = ">=3.12"
dependencies = [
    "curl_cffi",
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.1",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
courtside = "courtside.cli:main"

[project.optional-dependencies]
pdf = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pydfs-lineup-optimizer>=3.6.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
